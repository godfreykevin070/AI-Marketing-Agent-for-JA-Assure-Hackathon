services:
  db:
    image: postgres:16-alpine
    container_name: ja_assure_db
    environment:
      POSTGRES_USER: ja
      POSTGRES_PASSWORD: ja
      POSTGRES_DB: ja_assure
    ports:
      - "5432:5432"
    volumes:
      - ja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ja"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ja_pgdata: